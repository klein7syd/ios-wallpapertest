name: Todo Wallpaper native app
on:
  push:
    branches: [main]
    paths: ['TodoWallpaper/**', 'native-tools/**', '.github/workflows/todo-wallpaper.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: todo-wallpaper-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-app:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check persistence and native PNG rendering, then build app and Widget
        shell: bash
        run: bash native-tools/build-product.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: todo-wallpaper-0.4.3-${{ github.run_number }}
          path: TodoWallpaper/out/
          retention-days: 7
          if-no-files-found: error
