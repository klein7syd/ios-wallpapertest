name: R1 native baseline verification
on:
  push:
    branches: [main]
    paths: ['native-validation/**', '.github/workflows/r1-baseline.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r1-baseline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile-baseline:
    runs-on: macos-26
    timeout-minutes: 12
    defaults:
      run:
        working-directory: native-validation
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build original R1 app and Widget without Apple credentials
        shell: bash
        run: bash tools/build.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r1-baseline-ci-${{ github.run_number }}
          path: native-validation/out/
          retention-days: 7
          if-no-files-found: error
