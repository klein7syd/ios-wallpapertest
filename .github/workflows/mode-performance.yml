name: Editor mode performance measurement
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record Simulator Debug mode actions with Time Profiler
        shell: bash
        run: bash native-tools/record-mode-performance.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-mode-performance-${{ github.run_number }}
          path: TodoWallpaper/out/
          retention-days: 7
          if-no-files-found: error
